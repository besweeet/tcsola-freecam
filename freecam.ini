[FreeCam]
; Keys are Windows virtual-key codes in decimal.
; Letters/digits are their ASCII code (W=87, A=65, S=83, D=68, E=69, Q=81).
; F9=120, F10=121, F11=122, F12=123, Shift=16, Ctrl=17, Space=32
; Full list: https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes
ToggleKey=120
Forward=87
Back=83
Left=65
Right=68
Up=69
Down=81
Fast=16
Slow=17

; Movement speed in game units per second, and the Fast/Slow key multipliers.
Speed=15
FastMultiplier=5
SlowMultiplier=0.2

; Mouse look. Flip InvertMouseX/Y (0 or 1) if a direction feels backwards.
UseMouse=1
MouseSensitivity=0.0025
InvertMouseX=0
InvertMouseY=1

; Keep the camera within this many units of the player (0 = no limit).
; Useful for testing whether crashes depend on how far away the camera goes.
MaxDistance=0

; 1 = while free cam is on the game sees no keyboard/mouse input (character stays put).
; Esc still reaches the game. Set 0 if input blocking causes any trouble.
BlockGameInput=1

; Advanced - leave alone unless the camera axes come out wrong (see freecam.log):
; ForwardRow = which of the camera's 3 matrix rows is "forward" (-1 auto, else 0/1/2)
; ForwardSign = 0 auto, or 1 / -1 to force which way forward points
ForwardRow=-1
ForwardSign=0

; 1 = survive a known engine crash (collision data for areas far from the player gets unloaded;
; the game then reads freed memory). The faulting math call is skipped instead of crashing.
CrashGuard=1

; 1 = wrap the game's collision query in a try/catch. If it touches unloaded collision data far
; from the player, the query is aborted ("nothing hit") instead of crashing the game.
; Set 0 if this ever causes trouble.
QueryGuard=1

; Write diagnostics to freecam.log next to this file.
Log=0
